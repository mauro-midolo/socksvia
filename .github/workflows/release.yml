# Push to main: lint + tests + build, then (if Conventional Commits call for it)
# bump the version, update CHANGELOG.md, tag, create a GitHub Release with the
# built files, and publish to PyPI via Trusted Publishing (OIDC, no API token).
#
# The release commit cannot re-trigger this pipeline:
#   1. it is pushed with GITHUB_TOKEN, and pushes made with GITHUB_TOKEN never
#      start new workflow runs;
#   2. its message contains "[skip ci]";
#   3. the `checks` job below is skipped for "chore(release):" commits anyway.
name: Release

on:
  push:
    branches:
      - main

# One release at a time; a run that is already going is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"

jobs:
  checks:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/checks.yml

  release:
    name: Version, tag and GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit and tag, create the release
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0 # semantic-release needs the full history and tags

      - name: Pin the branch to the tested commit
        run: git reset --hard "$GITHUB_SHA"

      - name: Check that main has not moved since this run started
        id: upstream
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse "origin/$GITHUB_REF_NAME")" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_REF_NAME has new commits: the next run will release them."
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.upstream.outputs.moved != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: Install locked release tools (python-semantic-release, twine)
        if: steps.upstream.outputs.moved != 'true'
        run: uv sync --locked --no-build --only-group release

      - name: Bump version, update changelog, build, tag, push, create GitHub Release
        id: release
        if: steps.upstream.outputs.moved != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
        run: uv run --no-sync semantic-release -v version

      - name: Check distributions
        if: steps.release.outputs.released == 'true'
        run: uv run --no-sync twine check --strict dist/*

      - name: Attach distributions to the GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync semantic-release -v publish --tag "${{ steps.release.outputs.tag }}"

      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.released == 'true'
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Optional dry run on TestPyPI: set the repository variable
  # PUBLISH_TO_TESTPYPI=true and create the `testpypi` environment.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: release
    if: needs.release.outputs.released == 'true' && vars.PUBLISH_TO_TESTPYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/socksvia/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [release, publish-testpypi]
    # Runs only if checks, build and release succeeded; TestPyPI may be skipped.
    if: >-
      always()
      && needs.release.result == 'success'
      && needs.release.outputs.released == 'true'
      && (needs.publish-testpypi.result == 'success' || needs.publish-testpypi.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/socksvia/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
