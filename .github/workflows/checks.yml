# Reusable workflow: lint + tests + build. Called by ci.yml and release.yml.
#
# Tools are installed from uv.lock with `uv sync --locked --no-build`: exact
# versions with hashes, prebuilt wheels only (no sdist build scripts are run),
# no unpinned `pip install`. The tests import socksvia straight from src/
# (pytest `pythonpath`), so the project itself is never built here; the
# `build` job is the only place that builds it, on purpose.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Install locked dev tools
        run: uv sync --locked --no-build --only-group dev
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .
      - name: ruff format
        run: uv run --no-sync ruff format --check --diff .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three OSes: interface enumeration and keyboard handling have
        # Windows-only (iphlpapi, msvcrt) and POSIX-only (getifaddrs, termios) code.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Install locked dev tools (wheels only)
        run: uv sync --locked --no-build --no-install-project
      - name: pytest
        run: uv run --no-sync pytest

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Install locked dev tools
        run: uv sync --locked --no-build --only-group dev
      - name: Build
        run: uv build
      - name: twine check
        run: uv run --no-sync twine check --strict dist/*
      - name: Smoke test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl socksvia --version
          uv run --isolated --no-project --with dist/*.whl socksvia --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist-check
          path: dist/
          retention-days: 7
