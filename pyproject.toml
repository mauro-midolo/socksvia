[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "socksvia"
version = "0.0.0"
description = "Tiny SOCKS5 proxy that routes outbound traffic through the network interface you choose."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mauro Midolo" }]
keywords = ["socks", "socks5", "proxy", "network", "interface", "nic", "routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mauro-midolo/socksvia"
Repository = "https://github.com/mauro-midolo/socksvia"
Issues = "https://github.com/mauro-midolo/socksvia/issues"
Changelog = "https://github.com/mauro-midolo/socksvia/blob/main/CHANGELOG.md"

[project.scripts]
socksvia = "socksvia.cli:main"

# Development tools (PEP 735): pip install --group dev -e .   (pip >= 25.1)
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17,<0.18", # pinned minor: new ruff releases can add lint findings
    "build>=1.2",
    "twine>=6.1",
]

[tool.hatch.build.targets.sdist]
include = ["src/socksvia", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/socksvia"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "posix_only: test uses POSIX-only APIs (getifaddrs, termios)",
    "windows_only: test uses Windows-only APIs (iphlpapi, msvcrt)",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "SIM105", # explicit try/except/pass is clearer around socket calls
]

# ---------------------------------------------------------------------------
# python-semantic-release
# ---------------------------------------------------------------------------
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/socksvia/__init__.py:__version__"]
commit_parser = "conventional"
tag_format = "v{version}"
# Start at 0.x: feat -> minor, fix/perf -> patch, breaking change -> minor while on 0.x.
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): v{version} [skip ci]\n\nAutomatically generated by python-semantic-release"
build_command = "python -m pip install --upgrade build && python -m build"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
exclude_commit_patterns = [
    '''^Merge (pull request|branch) .*''',
    '''^Initial commit$''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
